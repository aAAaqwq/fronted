name: CI/CD to Docker Hub + Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOCKER_IMAGE_NAME: aaqwqaa/sensor_frontend
  DOCKER_CONTAINER_NAME: frontend
  DOCKER_CONTAINER_PORT: 80
  HOST_HTTP_PORT: 3001

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: dev
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_NAME }}:latest
            ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
          cache-from: |
            type=registry,ref=${{ env.DOCKER_IMAGE_NAME }}:buildcache
          cache-to: |
            type=registry,ref=${{ env.DOCKER_IMAGE_NAME }}:buildcache,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_SSH_HOST }}
          username: ${{ secrets.SERVER_SSH_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          script_stop: true
          script: |
            cd /srv/frontend || exit 1

            # 拉取最新镜像（带重试机制）
            max_retries=5
            retry_count=0
            while [ $retry_count -lt $max_retries ]; do
              if docker compose -f docker-compose.prod.yml pull frontend; then
                break
              fi
              retry_count=$((retry_count + 1))
              if [ $retry_count -lt $max_retries ]; then
                echo "Pull failed, retrying in 10 seconds... (Attempt $retry_count/$max_retries)"
                sleep 10
              else
                echo "Max retries reached. Exiting."
                exit 1
              fi
            done

            # 重启服务
            docker compose -f docker-compose.prod.yml up -d frontend

            # 清理未使用的镜像
            docker image prune -f --filter "until=24h"
